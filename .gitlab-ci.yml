stages:
    - release
    - build

variables:
    VLC_VERSION: "4.0"
    VLC_PATH: /Users/videolanci/sandbox/bin

############
## Builds ##
############

.continous-job-base-main:
    tags:
        - macos-xcode15
    stage: build
    rules:
        - if: '$CI_COMMIT_BRANCH == "build-4.0"'
          when: manual
        - when: never
    interruptible: true

.continous-build-base-main:
    script:
        - ./compileAndBuildVLCKit.sh -${BUILD_PARAM}
    after_script:
        - rm -rf build/ || true
        - rm -rf libvlc/vlc || true
        - rm -rf *-binary || true


continous-VLCKit-macOS-main:
    extends:
        - .continous-job-base-main
        - .continous-build-base-main
    variables:
        BUILD_PARAM: "vx"
        JOB_NAME: "VLCKit"


############################################################
## Development artifacts builds                           ##
## These are running every time a merge request is merged ##
## or a commit gets pushed to the default branch          ##
############################################################

.dev-artifacts-job-base-main:
    tags:
        - macos-xcode15
    rules:
        - if: '$CI_COMMIT_BRANCH == "build-4.0"'
          when: manual
        - when: never

    artifacts:
        paths:
            - ./*.tar.xz
    stage: build

.dev-artifacts-build-base-main:
    script:
        - ./compileAndBuildVLCKit.sh -${BUILD_PARAM}
        - ./Packaging/create-distributable-package.sh -${PACKAGING_PARAM}
        - mv *.tar.xz ${JOB_NAME}-${VLC_VERSION}-`date +%Y%m%d-%H%M`.tar.xz
    after_script:
        - rm -rf build/ || true
        - rm -rf libvlc/vlc || true
        - rm -rf *-binary || true


dev-artifacts-VLCKit-macOS-main:
    extends:
        - .dev-artifacts-job-base-main
        - .dev-artifacts-build-base-main
    variables:
        BUILD_PARAM: "x"
        PACKAGING_PARAM: "x"
        JOB_NAME: "VLCKit-macOS"


####################
## Release builds ##
####################

.release-job-base-main:
    tags:
        - macos-xcode15
    stage: release
    only:
        - tags
    artifacts:
        paths:
            - ./*.tar.xz

.release-build-base-main:
    script:
        - cd Packaging
        - ./buildAndDeployFrameworks.sh -${BUILD_PARAM}
    after_script:
        - rm -rf build/ || true
        - rm -rf libvlc/vlc || true
        - rm -rf *-binary || true


VLCKit-main:
    extends:
        - .release-job-base-main
        - .release-build-base-main
    variables:
        BUILD_PARAM: "x"
